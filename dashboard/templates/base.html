<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ dashboard_name }} - Trading Dashboard</title>

    <!-- Chart.js for Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <h1 class="logo">⚡ {{ dashboard_name }}</h1>
            </div>

            <div class="navbar-status">
                <div class="status-item">
                    <span class="status-label">Bot Status:</span>
                    <span class="status-badge" id="bot-status">
                        <span class="status-dot offline"></span>
                        <span id="status-text">Loading...</span>
                    </span>
                </div>
                <div class="status-item">
                    <span class="status-label">Last Update:</span>
                    <span class="status-value" id="last-update">--:--:--</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>XAUUSD Trading Bot Dashboard v{{ app_version }} &copy; 2026</p>
        <p class="footer-note">Real-time data • Auto-refresh every {{ refresh_interval }}ms</p>
    </footer>

    <!-- Error Toast -->
    <div id="error-toast" class="toast error-toast" style="display: none;">
        <span id="error-message"></span>
        <button class="toast-close" onclick="this.parentElement.style.display='none';">✕</button>
    </div>

    <!-- Scripts -->
    <script>
        // Configuration
        const DASHBOARD_CONFIG = {
            refreshInterval: {{ refresh_interval }},
            apiBaseUrl: '/api',
            timezone: 'UTC'
        };
    </script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
